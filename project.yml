name: Sweep
options:
  bundleIdPrefix: com.debroye
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    CURRENT_PROJECT_VERSION: "4"
    MARKETING_VERSION: "1.1.2"
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES

targets:
  SweepCore:
    type: framework
    platform: macOS
    sources:
      - Core
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debroye.sweep.core
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  SweepHelper:
    type: tool
    platform: macOS
    sources:
      - Helper
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debroye.sweep.helper

  Sweep:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - target: SweepCore
        embed: true
        codeSign: true
      - target: SweepHelper
        embed: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sweep
        CFBundleName: Sweep
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIdentifier: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Antoine Debroye"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSPrincipalClass: NSApplication
        NSServices:
          - NSMenuItem:
              default: Uninstall with Sweep
            NSMessage: uninstallApp
            NSPortName: Sweep
            NSSendTypes:
              - public.file-url
              - NSFilenamesPboardType
            NSSendFileTypes:
              - com.apple.application-bundle
    entitlements:
      path: App/Sweep.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debroye.sweep
        PRODUCT_NAME: Sweep
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Embed Privileged Helper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          APP_CONTENTS="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${APP_CONTENTS}/Library/LaunchDaemons"
          cp -f "${BUILT_PRODUCTS_DIR}/SweepHelper" "${APP_CONTENTS}/MacOS/SweepHelper"
          cp -f "${SRCROOT}/Helper/com.debroye.sweep.helper.plist" "${APP_CONTENTS}/Library/LaunchDaemons/com.debroye.sweep.helper.plist"

  SweepTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: SweepCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.debroye.sweep.tests
        GENERATE_INFOPLIST_FILE: YES
        LD_RUNPATH_SEARCH_PATHS: "@loader_path/../Frameworks @executable_path/../Frameworks $(BUILT_PRODUCTS_DIR)"

schemes:
  Sweep:
    build:
      targets:
        Sweep: all
        SweepTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SweepTests
